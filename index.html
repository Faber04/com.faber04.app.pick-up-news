<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e6f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07131f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        gap: 1rem;
        justify-items: center;
        background: #e6f6f8;
        transition: opacity 260ms ease, visibility 260ms ease;
      }

      #boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #boot-splash-logo {
        width: 84px;
        height: 84px;
      }

      #boot-splash-title {
        margin: 0;
        color: #083343;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      #boot-splash-spinner {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        border: 3px solid rgba(10, 155, 186, 0.24);
        border-top-color: #0a9bba;
        animation: boot-splash-spin 0.8s linear infinite;
      }

      @keyframes boot-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        #boot-splash {
          background: #07131f;
        }

        #boot-splash-title {
          color: #d5eef5;
        }

        #boot-splash-spinner {
          border-color: rgba(48, 201, 232, 0.24);
          border-top-color: #30c9e8;
        }
      }
    </style>
    <title>Pick-Up News</title>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img id="boot-splash-logo" src="/pickupnews-mark.svg" alt="" />
      <p id="boot-splash-title">Pick-Up News</p>
      <div id="boot-splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
